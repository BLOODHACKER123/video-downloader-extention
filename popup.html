
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-icon">▶</div>
      <div class="brand-copy">
        <h1>Video Downloader</h1>
        <p>Media tools for your browser</p>
      </div>
    </header>

    <nav class="nav-tabs" aria-label="Main navigation">
      <button id="scannerTab" class="nav-tab active">Scanner</button>
      <button id="downloadsTab" class="nav-tab">
        Downloads <span id="downloadBadge">0</span>
      </button>
    </nav>

    <section id="scannerView">
      <section class="hero">
        <span class="eyebrow">CURRENT TAB</span>
        <h2>Find your videos</h2>
        <p>Scan this page for supported media.</p>
        <button id="scanButton" class="primary">⌕ Scan page</button>
      </section>

      <section class="results">
        <div class="section-heading">
          <h3>Detected media</h3>
          <span id="count" class="count">0</span>
        </div>

        <p id="status" class="status" role="status">
          Scan a webpage to get started.
        </p>

        <div id="videoList" class="list"></div>
      </section>
    </section>

    <section id="downloadsView" hidden>
      <div class="manager-heading">
        <div>
          <span class="eyebrow">YOUR ACTIVITY</span>
          <h2>Downloads</h2>
        </div>
        <button id="refreshButton" class="icon-button" title="Refresh downloads" aria-label="Refresh downloads">↻</button>
      </div>

      <div class="filters" aria-label="Filter downloads">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="in_progress">Active</button>
        <button class="filter" data-filter="complete">Completed</button>
        <button class="filter" data-filter="interrupted">Failed</button>
      </div>

      <p id="downloadStatus" class="status" role="status">
        Loading download history...
      </p>

      <div id="downloadList" class="list"></div>
    </section>

    <footer>
      <span class="live-dot"></span>
      <span>Powered by Chrome Downloads</span>
    </footer>
  </main>
</body>
</html>
